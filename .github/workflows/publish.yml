name: Publish

# Dispatch-only. Every run builds the Windows Plate twice, stamps both builds with the next
# preview version, attaches them to the run as artifacts, then drafts a GitHub pre-release
# carrying them:
#
#   Broiler.Plate-<version>-win-x64-self-contained.zip       Broiler.Plate.Windows.exe
#   Broiler.Plate-<version>-win-x64-framework-dependent.zip  Broiler.Plate.Windows.exe + its .dlls
#
# self-contained is NativeAOT, which is what makes the executable the whole application:
# trimmed, no .NET runtime to install, nothing beside it. framework-dependent is the ordinary
# IL build: a much smaller download that runs on an installed .NET 10 runtime.
#
# Nothing is pushed to a feed, and every package restores from nuget.org (NuGet.config). The
# draft release (eng/release-draft.sh) stays private until someone publishes it.
#
# The version is BroilerPlateVersion (Directory.Build.props) raised past every earlier
# run's plate-v* tag, and a successful run tags its commit, so preview numbers only ever
# increase and never name two builds. See eng/resolve-preview-version.mjs.
on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: >-
          Optional preview.N override (unused, and at least the next preview). Empty picks
          the next preview automatically.
        type: string
        default: ''

permissions:
  contents: read

# One run at a time, so two runs cannot pick the same preview number.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the version resolver
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  build:
    name: win-x64 (${{ matrix.variant }})
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
        include:
          # PublishAot implies self-contained and trimmed: one native binary. windows-latest
          # carries the MSVC C++ linker NativeAOT shells out to.
          - variant: self-contained
            publish-args: -p:PublishAot=true
          # The IL build beside its .dlls; the .NET 10 runtime comes from the machine.
          - variant: framework-dependent
            publish-args: --self-contained false

    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: artifacts/publish/win-x64-${{ matrix.variant }}
      EXECUTABLE: Broiler.Plate.Windows.exe

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # Release-Windows pins win-x64. BroilerPlateVersion flows into Version, so the About
      # dialog and the file version match the artifact.
      - name: Publish
        run: |
          dotnet publish src/Broiler.Plate.Windows/Broiler.Plate.Windows.csproj \
            -c Release-Windows \
            ${{ matrix.publish-args }} \
            -p:BroilerPlateVersion="$VERSION" \
            -o "$OUT"

      # Symbols and XML docs are dead weight in a release; drop them before checking what
      # is left.
      - name: Drop symbols and XML docs
        run: |
          find "$OUT" -type f -name '*.pdb' -delete
          find "$OUT" -type f -name '*.xml' | while read -r xml; do
            if [ -f "${xml%.xml}.dll" ]; then rm -f "$xml"; fi
          done

      # self-contained: the artifact is the executable alone; anything else would be a file
      # the application needs, so shipping without it would be broken - fail rather than
      # drop it.
      - name: Check that the executable is the whole application
        if: matrix.variant == 'self-contained'
        run: |
          others=$(find "$OUT" -type f ! -name "$EXECUTABLE")
          if [ ! -f "$OUT/$EXECUTABLE" ] || [ -n "$others" ]; then
            echo "::error::Expected only $EXECUTABLE in the publish output."
            find "$OUT" -type f
            exit 1
          fi

      # framework-dependent: the apphost, the application assembly and the runtimeconfig
      # that names the framework must be there, and no runtime may have leaked in - that
      # would be a self-contained build under the wrong name.
      - name: Check that the build is framework-dependent
        if: matrix.variant == 'framework-dependent'
        run: |
          for f in "$EXECUTABLE" Broiler.Plate.Windows.dll Broiler.Plate.Windows.runtimeconfig.json; do
            [ -f "$OUT/$f" ] || { echo "::error::Missing $f in the publish output."; find "$OUT" -type f; exit 1; }
          done
          grep -q '"Microsoft.NETCore.App"' "$OUT/Broiler.Plate.Windows.runtimeconfig.json" \
            || { echo '::error::The runtimeconfig names no shared framework.'; exit 1; }
          for f in coreclr.dll System.Private.CoreLib.dll; do
            [ ! -f "$OUT/$f" ] || { echo "::error::$f is in a framework-dependent build."; exit 1; }
          done

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $viewer = Start-Process -FilePath "$env:OUT/$env:EXECUTABLE" -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($viewer.HasExited) { throw "The viewer exited with code $($viewer.ExitCode) instead of staying up." }
            Write-Host 'The published viewer started and stayed up.'
          }
          finally {
            if (-not $viewer.HasExited) { Stop-Process -Id $viewer.Id -Force }
            $viewer.Dispose()
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-plate-win-x64-${{ matrix.variant }}-${{ env.VERSION }}
          path: ${{ env.OUT }}/
          if-no-files-found: error

  release:
    name: Tag and draft release ${{ needs.version.outputs.tag }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Only after both builds succeeded: a failed run leaves its number free. The tag is
      # pushed here rather than left to the release, because a draft release does not
      # create its tag until it is published - and the next run counts tags.
      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # A pattern matching several artifacts extracts each into a directory of its name,
      # which is the layout eng/release-draft.sh reads.
      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          pattern: broiler-plate-win-x64-*-${{ env.VERSION }}
          path: artifacts

      # A draft pre-release: nothing is public until someone reviews and publishes it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash eng/release-draft.sh "$VERSION" artifacts

      - name: Summary
        run: |
          {
            echo "### Broiler.Plate $VERSION"
            echo
            echo "Dependencies restored from nuget.org; commit tagged \`$TAG\`."
            echo
            echo "A draft pre-release **Broiler Plate $VERSION** was created with"
            echo "\`Broiler.Plate-$VERSION-win-x64-self-contained.zip\` and"
            echo "\`Broiler.Plate-$VERSION-win-x64-framework-dependent.zip\`."
            echo "Review it under Releases and publish it there."
          } >> "$GITHUB_STEP_SUMMARY"
