name: Publish

# One product version and release for all selected targets.
# Platform implementation stays in reusable build jobs; only this workflow publishes.
on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: Optional preview.N override; blank increments the existing product release line.
        type: string
        default: ''
      windows:
        description: Publish Windows x64 (NativeAOT and framework-dependent).
        type: boolean
        default: true
      linux:
        description: Publish Linux x64 (NativeAOT and framework-dependent).
        type: boolean
        default: true
      web:
        description: Publish verified WebAssembly assets.
        type: boolean
        default: true
      create_draft:
        description: Keep the release private for review; false publishes the prerelease.
        type: boolean
        default: true
  workflow_call:
    inputs:
      version-suffix:
        description: Optional preview.N override; blank increments the existing product release line.
        type: string
        default: ''
      windows:
        description: Publish Windows x64 (NativeAOT and framework-dependent).
        type: boolean
        default: true
      linux:
        description: Publish Linux x64 (NativeAOT and framework-dependent).
        type: boolean
        default: true
      web:
        description: Publish verified WebAssembly assets.
        type: boolean
        default: true
      create_draft:
        description: Keep the release private for review; false publishes the prerelease.
        type: boolean
        default: true
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
      tag:
        value: ${{ jobs.version.outputs.tag }}

permissions:
  contents: read

# One run at a time, so two runs cannot pick the same preview number.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Verify producer repository context
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "Broiler-Platform/Broiler.Plate" ]; then
            echo "::error::Dispatch Publish in the producer repository; a caller token/source context cannot publish this product."
            exit 1
          fi
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the version resolver
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Resolve selected targets
        id: targets
        env:
          PUBLISH_WINDOWS: ${{ inputs.windows }}
          PUBLISH_LINUX: ${{ inputs.linux }}
          PUBLISH_WEB: ${{ inputs.web }}
        run: node eng/publish-targets.mjs

      - name: Test target selection and release packaging
        run: |
          node --test eng/publish-targets.test.mjs
          python -m unittest discover -s eng -p test_release_packaging.py -v

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  build:
    name: ${{ matrix.rid }} (${{ matrix.variant }})
    needs: version
    if: inputs.windows || inputs.linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}

    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: artifacts/publish/${{ matrix.rid }}-${{ matrix.variant }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # ILCompiler shells out to a platform linker. windows-latest carries the MSVC C++
      # tools; on Linux the toolchain is clang plus zlib headers.
      - name: Install the NativeAOT prerequisites
        if: runner.os == 'Linux' && matrix.variant == 'self-contained'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # self-contained: PublishAot implies self-contained and trimmed - one native binary,
      # no .NET runtime to install. framework-dependent: PublishAot is switched off and
      # the output runs on an installed runtime.
      # BroilerPlateVersion flows into Version, so the About dialog and the file version
      # match the artifact.
      - name: Publish
        run: |
          if [ '${{ matrix.variant }}' = self-contained ]; then
            mode=(-p:PublishAot=true)
          else
            mode=(--self-contained false -p:PublishAot=false)
          fi
          dotnet publish '${{ matrix.project }}' \
            -c '${{ matrix.configuration }}' \
            "${mode[@]}" \
            -p:BroilerPlateVersion="$VERSION" \
            -o "$OUT"

      # The self-contained artifact is the executable alone. Symbols (.pdb, and Linux's
      # detached .dbg) and XML docs are dead weight next to it; anything else would be a file
      # the application needs, so shipping without it would be broken - fail rather than
      # drop it.
      - name: Check that the executable is the whole application
        if: matrix.variant == 'self-contained'
        run: |
          others=$(find "$OUT" -type f ! -name '${{ matrix.executable }}' \
            ! -name '*.pdb' ! -name '*.dbg' ! -name '*.xml')
          if [ ! -f "$OUT/${{ matrix.executable }}" ] || [ -n "$others" ]; then
            echo "::error::Expected only ${{ matrix.executable }} in the publish output."
            find "$OUT" -type f
            exit 1
          fi

      # The framework-dependent artifact is the whole publish folder: the executable, the
      # application's assembly and runtimeconfig, and every managed dependency. It must not
      # carry a runtime of its own - that would make it self-contained under the wrong name.
      # Symbols and the XML docs that sit beside an assembly are dropped; everything else ships.
      - name: Check the framework-dependent output
        if: matrix.variant == 'framework-dependent'
        run: |
          for f in '${{ matrix.executable }}' '${{ matrix.assembly }}.dll' '${{ matrix.assembly }}.runtimeconfig.json'; do
            if [ ! -f "$OUT/$f" ]; then
              echo "::error::Expected $f in the publish output."
              find "$OUT" -type f
              exit 1
            fi
          done
          runtime=$(find "$OUT" -type f \( -iname 'coreclr.dll' -o -name 'libcoreclr.so' -o -iname 'hostfxr.dll' -o -name 'libhostfxr.so' \))
          if [ -n "$runtime" ]; then
            echo "::error::The framework-dependent output carries a .NET runtime: $runtime"
            exit 1
          fi
          find "$OUT" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          find "$OUT" -type f -name '*.xml' | while read -r doc; do
            if [ -f "${doc%.xml}.dll" ]; then rm "$doc"; fi
          done
          echo "$(find "$OUT" -type f | wc -l) files in the framework-dependent output."

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-plate-${{ matrix.rid }}-${{ matrix.variant }}-${{ env.VERSION }}
          path: ${{ matrix.variant == 'self-contained' && format('{0}/{1}', env.OUT, matrix.executable) || env.OUT }}
          if-no-files-found: error

  web:
    name: Publish reusable Plate WebAssembly artifact
    needs: version
    if: inputs.web
    uses: ./.github/workflows/web-artifact.yml
    with:
      version: ${{ needs.version.outputs.version }}
      source_tag: ${{ needs.version.outputs.tag }}

  release-tests:
    name: Product release regression tests
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-broiler
      - name: Test product before release
        run: dotnet test src/tests/Broiler.Plate.Windows.Tests/Broiler.Plate.Windows.Tests.csproj -c Release

  release:
    name: Create release ${{ needs.version.outputs.tag }}
    needs: [version, build, web, release-tests]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
          needs.release-tests.result == 'success' &&
          (!inputs.windows && !inputs.linux || needs.build.result == 'success') &&
          (!inputs.web || needs.web.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PUBLISH_WINDOWS: ${{ inputs.windows }}
      PUBLISH_LINUX: ${{ inputs.linux }}
      PUBLISH_WEB: ${{ inputs.web }}
      CREATE_DRAFT: ${{ inputs.create_draft }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: broiler-plate-*
          path: artifacts

      - name: Create the selected release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash eng/release-draft.sh "$VERSION" artifacts

      - name: Summary
        run: |
          echo "Product release: $TAG (draft=$CREATE_DRAFT)" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows=$PUBLISH_WINDOWS; Linux=$PUBLISH_LINUX; Web=$PUBLISH_WEB" >> "$GITHUB_STEP_SUMMARY"
