name: Publish

# Dispatch-only. Every run builds the Windows Plate with NativeAOT, stamps it with the next
# preview version, attaches it to the run as an artifact, then drafts a GitHub pre-release
# carrying it:
#
#   broiler-plate-win-x64-<version>.zip    Broiler.Plate.Windows.exe
#
# NativeAOT is what makes the executable the whole application: self-contained, trimmed,
# no .NET runtime to install, nothing beside it. Nothing is pushed to a feed. The draft
# release (eng/release-draft.sh) zips the executable as Broiler.Plate-<version>-win-x64.zip
# and stays private until someone publishes it.
#
# nuget-source picks the feed the Broiler.* dependencies are restored from. NuGet.config maps
# Broiler.* to the Broiler-Platform GitHub Packages feed (broiler-github, the default);
# nuget.org drops that mapping for the run, so Broiler.* resolves from nuget.org like
# everything else.
#
# The version is BroilerPlateVersion (Directory.Build.props) raised past every earlier
# run's plate-v* tag, and a successful run tags its commit, so preview numbers only ever
# increase and never name two builds. See eng/resolve-preview-version.mjs.
on:
  workflow_dispatch:
    inputs:
      nuget-source:
        description: Feed to restore the Broiler.* dependency packages from
        type: choice
        options: [broiler-github, nuget.org]
        default: broiler-github
      version-suffix:
        description: >-
          Optional preview.N override (unused, and at least the next preview). Empty picks
          the next preview automatically.
        type: string
        default: ''

permissions:
  contents: read
  packages: read

# One run at a time, so two runs cannot pick the same preview number.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test the version resolver
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Resolve version
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: node eng/resolve-preview-version.mjs

  build:
    name: win-x64 (NativeAOT)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: artifacts/publish/win-x64
      EXECUTABLE: Broiler.Plate.Windows.exe
      # Read by NuGet for the github-broiler source in NuGet.config. Unused, and harmless,
      # when Broiler.* restores from nuget.org.
      NuGetPackageSourceCredentials_github-broiler: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # NuGet.config maps Broiler.* to github-broiler and everything else to nuget.org.
      # Dropping the Broiler.* mapping leaves the catch-all, which moves exactly the Broiler
      # packages.
      - name: Restore Broiler.* from ${{ inputs.nuget-source }}
        if: inputs.nuget-source == 'nuget.org'
        run: |
          sed -i '/<packageSource key="github-broiler">/,/<\/packageSource>/d' NuGet.config
          ! grep -q '<packageSource key="github-broiler">' NuGet.config

      # PublishAot implies self-contained and trimmed: one native binary, no .NET runtime
      # to install. Release-Windows pins win-x64, the runtime identifier NativeAOT needs, and
      # windows-latest carries the MSVC C++ linker it shells out to. BroilerPlateVersion flows
      # into Version, so the About dialog and the file version match the artifact.
      - name: Publish
        run: |
          dotnet publish src/Broiler.Plate.Windows/Broiler.Plate.Windows.csproj \
            -c Release-Windows \
            -p:PublishAot=true \
            -p:BroilerPlateVersion="$VERSION" \
            -o "$OUT"

      # The artifact is the executable alone. Symbols and XML docs are dead weight next to
      # it; anything else would be a file the application needs, so shipping without it
      # would be broken - fail rather than drop it.
      - name: Check that the executable is the whole application
        run: |
          others=$(find "$OUT" -type f ! -name "$EXECUTABLE" ! -name '*.pdb' ! -name '*.xml')
          if [ ! -f "$OUT/$EXECUTABLE" ] || [ -n "$others" ]; then
            echo "::error::Expected only $EXECUTABLE in the publish output."
            find "$OUT" -type f
            exit 1
          fi

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $viewer = Start-Process -FilePath "$env:OUT/$env:EXECUTABLE" -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($viewer.HasExited) { throw "The viewer exited with code $($viewer.ExitCode) instead of staying up." }
            Write-Host 'The published viewer started and stayed up.'
          }
          finally {
            if (-not $viewer.HasExited) { Stop-Process -Id $viewer.Id -Force }
            $viewer.Dispose()
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: broiler-plate-win-x64-${{ env.VERSION }}
          path: ${{ env.OUT }}/${{ env.EXECUTABLE }}
          if-no-files-found: error

  release:
    name: Tag and draft release ${{ needs.version.outputs.tag }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Only after the build succeeded: a failed run leaves its number free. The tag is
      # pushed here rather than left to the release, because a draft release does not
      # create its tag until it is published - and the next run counts tags.
      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # By name, into the directory eng/release-draft.sh reads: a pattern matching a single
      # artifact extracts it straight into `path`, with no per-artifact directory.
      - name: Download the executable
        uses: actions/download-artifact@v8
        with:
          name: broiler-plate-win-x64-${{ env.VERSION }}
          path: artifacts/broiler-plate-win-x64-${{ env.VERSION }}

      # A draft pre-release: nothing is public until someone reviews and publishes it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash eng/release-draft.sh "$VERSION" artifacts

      - name: Summary
        run: |
          {
            echo "### Broiler.Plate $VERSION"
            echo
            echo "Dependencies restored from \`${{ inputs.nuget-source }}\`; commit tagged \`$TAG\`."
            echo
            echo "A draft pre-release **Broiler Plate $VERSION** was created with"
            echo "\`Broiler.Plate-$VERSION-win-x64.zip\`."
            echo "Review it under Releases and publish it there."
          } >> "$GITHUB_STEP_SUMMARY"
