name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  solutions:
    name: Solution manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The generator walks local project references; packages need no checkout.
      - name: Verify the generated solutions
        shell: pwsh
        run: ./scripts/update-solutions.ps1 -Verify

  build:
    name: Windows head
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Build
        run: dotnet build Broiler.Windows.Plate.slnx -c Release

  # The tests exercise the Windows head's actual PDF composition and shared UI.
  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      - name: Test
        run: dotnet test Broiler.Plate.Tests.slnx -c Release

  # Release-Windows pins win-x64 and is only declared by the project. Exercise
  # NativeAOT here as well as in release.yml so failures surface before release.
  publish:
    name: Publish win-x64 (NativeAOT)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup-broiler

      # windows-latest includes the MSVC C++ linker required by NativeAOT.
      - name: Publish
        run: dotnet publish src/Broiler.Plate.Windows/Broiler.Plate.Windows.csproj -c Release-Windows -p:PublishAot=true -o ./artifacts/win-x64

      - name: Smoke-test the published binary
        shell: pwsh
        run: |
          $exe = './artifacts/win-x64/Broiler.Plate.Windows.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Published executable not found at $exe." }
          $viewer = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($viewer.HasExited) { throw "The viewer exited with code $($viewer.ExitCode) instead of staying up." }
            Write-Host 'The published viewer started and stayed up.'
          }
          finally {
            if (-not $viewer.HasExited) { Stop-Process -Id $viewer.Id -Force }
            $viewer.Dispose()
          }
