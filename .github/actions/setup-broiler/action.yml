name: Set up Broiler.Plate
description: >-
  Installs the .NET SDK. Every package, the Broiler.* components included, restores from
  nuget.org as NuGet.config says, so no feed credentials are needed.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
